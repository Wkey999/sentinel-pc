[package]
name = "sentinel-pc"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "sentinel_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
sentinel-core = { path = "../crates/sentinel-core" }
serde = { version = "1", features = ["derive"] }
